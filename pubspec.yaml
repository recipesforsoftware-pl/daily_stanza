name: daily_stanza
description: "One public-domain poem per day with Stanzi the mascot."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/stanzi.png

  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic

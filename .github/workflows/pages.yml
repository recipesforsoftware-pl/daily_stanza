name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Jekyll source
        run: |
          set -euo pipefail
          mkdir -p _site_src
          cp -r docs/pages/. _site_src/

          {
            printf '%s\n' '---' 'layout: default' 'title: Privacy Policy' 'permalink: /privacy/' '---' ''
            cat PRIVACY_POLICY.md
          } > _site_src/privacy.md

          {
            printf '%s\n' '---' 'layout: default' 'title: Support' 'permalink: /support/' '---' ''
            sed -e 's#\.\./PRIVACY_POLICY\.md#{{ "/privacy/" | relative_url }}#g' \
                -e 's#\.\./firebase/seed/CONTENT_SOURCES\.md#https://github.com/recipesforsoftware-pl/daily_stanza/blob/main/firebase/seed/CONTENT_SOURCES.md#g' \
                docs/support.md
          } > _site_src/support.md

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

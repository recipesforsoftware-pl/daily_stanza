name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tracked files for credentials
        run: ./tool/check_no_tracked_secrets.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Firebase client configuration
        shell: bash
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$FIREBASE_OPTIONS_DART_B64"
          test -n "$GOOGLE_SERVICES_JSON_B64"
          test -n "$GOOGLE_SERVICE_INFO_PLIST_B64"

          mkdir -p lib android/app ios/Runner

          printf '%s' "$FIREBASE_OPTIONS_DART_B64" \
            | base64 --decode > lib/firebase_options.dart

          printf '%s' "$GOOGLE_SERVICES_JSON_B64" \
            | base64 --decode > android/app/google-services.json

          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" \
            | base64 --decode > ios/Runner/GoogleService-Info.plist

          chmod 600 \
            lib/firebase_options.dart \
            android/app/google-services.json \
            ios/Runner/GoogleService-Info.plist

          test -s lib/firebase_options.dart
          test -s android/app/google-services.json
          test -s ios/Runner/GoogleService-Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        shell: bash
        run: |
          git ls-files -z '*.dart' |
            xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze code
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  firestore-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase dependencies
        working-directory: firebase
        run: npm ci

      - name: Run Firestore Rules tests
        run: |
          ./firebase/node_modules/.bin/firebase emulators:exec \
            --only firestore \
            --project demo-daily-stanza \
            "cd firebase && node ./node_modules/jest/bin/jest.js --runInBand"